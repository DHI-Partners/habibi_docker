name: Habibi ERP image

# Собирает layered-образ (frappe + приложения из apps.json) и пушит в ghcr.io.
#
# Триггеры:
#   push               — изменился apps.json, скрипт сборки или сам workflow
#   workflow_dispatch  — вручную из UI
#   repository_dispatch — из другого репозитория (например, habibi-erp при
#                        пуше в main), см. HABIBI-DEPLOY.md

on:
  push:
    branches:
      - main
    paths:
      - apps.json
      - scripts/habibi-build.sh
      - .github/workflows/habibi-image.yml
  workflow_dispatch:
  repository_dispatch:
    types:
      - habibi-apps-updated

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/habibi-erp
  FRAPPE_BRANCH: version-16

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # apps.json в репозитории содержит только публичные URL. Для приватных
      # приложений положите готовый файл с токеном в секрет APPS_JSON —
      # он перезапишет версию из репозитория и не попадёт в слои образа.
      - name: Resolve apps.json
        env:
          APPS_JSON: ${{ secrets.APPS_JSON }}
        run: |
          if [ -n "$APPS_JSON" ]; then
            printf '%s' "$APPS_JSON" > apps.json
            echo "apps.json взят из секрета APPS_JSON"
          else
            echo "apps.json взят из репозитория"
          fi
          jq empty apps.json

      # Слой bench init кешируется по build-args. Без этого шага новые коммиты
      # приложений не попадут в образ — берём фактические SHA всех репозиториев
      # из apps.json и складываем в CACHE_BUST.
      - name: Compute CACHE_BUST from app commits
        id: bust
        run: |
          bust=""
          while read -r url branch; do
            sha=$(git ls-remote "$url" "refs/heads/$branch" | cut -f1)
            if [ -z "$sha" ]; then
              echo "не удалось разрешить $url @ $branch" >&2
              exit 1
            fi
            echo "$url @ $branch -> $sha"
            bust="${bust}${sha}"
          done < <(jq -r '.[] | "\(.url) \(.branch)"' apps.json)
          echo "value=$(printf '%s' "$bust" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:16
            ${{ env.IMAGE }}:16-${{ steps.bust.outputs.value }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            CACHE_BUST=${{ steps.bust.outputs.value }}
          secret-files: |
            apps_json=./apps.json
          cache-from: type=gha
          cache-to: type=gha,mode=max
